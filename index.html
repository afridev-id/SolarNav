<style>

.row{display:flex;gap:6px;align-items:center;pointer-events:auto}

#times{min-width:0}#tl{display:none;overflow-x:auto;min-width:0}#times.open #tl{display:flex}#clk{margin-left:auto;color:var(--mut)}#tools{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 6px);display:flex;gap:6px}#tools .b{width:40px;padding:7px 0;text-align:center}body.h #top,body.h #bot{display:none}

.go,.ex{display:none}body.g .go{display:flex}body:not(.g) .ex{display:flex}body.g #hud{display:block}

#menu p{margin:0;color:#b8c2e8;text-shadow:0 1px 6px #000}.big{font-size:17px;padding:12px 34px}.md{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.md .b{padding:10px 16px}
#sub{display:none;width:min(420px,100%);max-height:40vh;overflow:auto;text-align:left}#sub h3{margin:0 0 6px;font-size:15px}#sub .k{display:flex;justify-content:space-between;align-items:center;margin:6px 0}

#top{flex-direction:row;flex-wrap:wrap;align-items:center;left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 146px)}
#tools{right:calc(env(safe-area-inset-right,0px) + 8px)}
body.g #bot{left:calc(env(safe-area-inset-left,0px) + 8px);right:auto;width:min(250px,42vw)}
#joy{right:calc(env(safe-area-inset-right,0px) + 18px)}

</style></head><body>
<canvas id="c"></canvas>
<div id="top">
 <div class="row"><button class="b on" id="mE">🪐 Jelajah</button><button class="b" id="mG">🚀 Game</button><span id="clk"></span></div>

<div id="joy"><div id="knob"></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d'),C=299792.458,TAU=Math.PI*2;
let W,H,dpr;function rs(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}rs();addEventListener('resize',rs);
// DATA NYATA: jarak planet (juta km), jari-jari (km), periode (hari)
const P=[["Merkurius",57.9,2439.7,87.97,"#a8a29e"],["Venus",108.2,6051.8,224.7,"#e8c98a"],["Bumi",149.6,6371,365.25,"#4a90e2"],["Mars",227.9,3389.5,687,"#d9603b"],["Jupiter",778.5,69911,4332.6,"#d8a470"],["Saturnus",1432,58232,10759,"#e6d3a3"],["Uranus",2867,25362,30687,"#8ee6e6"],["Neptunus",4515,24622,60190,"#4b6fe8"]];
const DW=[["Ceres",414,473,1682,"#9a9a9a"],["Pluto",5906,1188.3,90560,"#e8d5b5"],["Haumea",6452,780,103774,"#dfe9f5"],["Makemake",6850,715,111845,"#d9a87a"],["Eris",10120,1163,203830,"#e0f0ff"]];
// bulan: induk, jarak (km), jari-jari (km), periode (hari)
const M=[["Bulan","Bumi",384400,1737.4,27.32,"#d8d8d0"],["Phobos","Mars",9376,11.3,.319,"#a99"],["Deimos","Mars",23463,6.2,1.263,"#b9a"],
["Io","Jupiter",421700,1821.6,1.769,"#e6d34a"],["Europa","Jupiter",671100,1560.8,3.551,"#e9e2d0"],["Ganymede","Jupiter",1070400,2634.1,7.155,"#a89f8c"],["Callisto","Jupiter",1882700,2410.3,16.69,"#6b6256"],
["Mimas","Saturnus",185540,198.2,.942,"#ccc"],["Enceladus","Saturnus",238040,252.1,1.37,"#fff"],["Tethys","Saturnus",294670,531.1,1.888,"#eee"],["Dione","Saturnus",377420,561.4,2.737,"#ddd"],["Rhea","Saturnus",527070,763.8,4.518,"#c8c8c8"],["Titan","Saturnus",1221870,2574.7,15.945,"#e0a860"],["Iapetus","Saturnus",3560840,734.5,79.32,"#8a8478"],
["Miranda","Uranus",129900,235.8,1.413,"#ccc"],["Ariel","Uranus",190900,578.9,2.52,"#c8c8c8"],["Umbriel","Uranus",266000,584.7,4.144,"#999"],["Titania","Uranus",436300,788.4,8.706,"#bbb"],["Oberon","Uranus",583500,761.4,13.46,"#a09890"],
["Triton","Neptunus",354759,1353.4,-5.877,"#d9b8c4"],["Proteus","Neptunus",117647,210,1.122,"#999"],["Nereid","Neptunus",5513400,170,360.1,"#bbb"],["Charon","Pluto",19591,606,6.387,"#b8aea0"]];
const bodies=[],by={};
function mk(n,par,a,r,T,col,type){const b={n,par,a,r,T,col,type,ph:Math.random()*TAU,x:0,y:0,ring:null};bodies.push(b);by[n]=b;return b}
const sun=mk("Matahari",null,0,696340,0,"#ffd34d","star");
P.forEach(p=>mk(p[0],sun,p[1]*1e6,p[2],p[3],p[4],"planet"));
DW.forEach(p=>mk(p[0],sun,p[1]*1e6,p[2],p[3],p[4],"dwarf"));
M.forEach(m=>mk(m[0],by[m[1]],m[2],m[3],m[4],m[5],"moon"));
by.Saturnus.ring=[74500,136800,"rgba(214,196,150,.55)"];by.Uranus.ring=[41837,51149,"rgba(200,240,240,.3)"];
const belts=[];function mb(n,a0,a1){for(let i=0;i<n;i++){const a=a0+Math.random()*(a1-a0);belts.push({a,ph:Math.random()*TAU,T:365.25*Math.pow(a/1.496e8,1.5)})}}
mb(1200,3.29e8,4.79e8);mb(1800,4.5e9,7.5e9);
const stars=Array.from({length:220},()=>[Math.random(),Math.random(),.2+Math.random()*.6]);
const dust=Array.from({length:90},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,f:[.4,.7,1][Math.random()*3|0],a:.25+Math.random()*.4}));let MV=[0,0];
const TIPE={star:"Bintang",planet:"Planet",dwarf:"Planet kerdil",moon:"Bulan"},SP=[.01,.1,1,11,30,100,1000,1e4,1e5,C];
let LG='id';const nf=(v,d=1)=>v.toLocaleString(LG==='en'?'en-US':'id-ID',{maximumFractionDigits:d});
const fk=v=>v>=1e9?nf(v/1e9)+" miliar km":v>=1e6?nf(v/1e6)+" juta km":nf(v,v<10?2:0)+" km";
const U=()=>LG==='en'?['s','min','h','days','y']:['dtk','mnt','jam','hari','th'];const fd=s=>{const u=U();return s<60?nf(s)+" "+u[0]:s<3600?nf(s/60)+" "+u[1]:s<86400?nf(s/3600)+" "+u[2]:s<3.156e7?nf(s/86400)+" "+u[3]:nf(s/3.156e7)+" "+u[4]};
// STATE
let mode='ex',t=0,days=1,LZ=-6.5,LZT=-6.5,cam={x:0,y:0},follow=null,sel=null,target=null,tgt=null,showO=true,showL=true,lv=Math.log10(11),auto=false,last=0,fc=0;
const R={x:0,y:0,vx:0,vy:0,h:0,anc:null,rx:0,ry:0,thr:0},found=new Set(),ach=new Set(),tw={a:null,s:0},K={},joy={x:0,y:0};
const clampZ=v=>Math.max(-8.3,Math.min(3,v));
function upd(){for(const b of bodies)if(b.par){const g=b.ph+TAU*t/b.T;b.x=b.par.x+b.a*Math.cos(g);b.y=b.par.y+b.a*Math.sin(g)}}
function resetR(){ap.on=false;const e=by.Bumi;R.x=e.x+e.r*1.6;R.y=e.y;R.vx=R.vy=0;R.h=0;R.anc=e;R.rx=R.x-e.x;R.ry=R.y-e.y}
function toast(m){const e=$('toast');e.textContent=tr(m);e.classList.add('s');clearTimeout(toast.i);toast.i=setTimeout(()=>e.classList.remove('s'),4200)}
// ORBIT & PENCAPAIAN
const SOI={Merkurius:1.1e5,Venus:6.2e5,Bumi:9.2e5,Mars:5.8e5,Jupiter:4.8e7,Saturnus:5.5e7,Uranus:5.2e7,Neptunus:8.7e7,Ceres:7.9e4,Pluto:3.1e6,Haumea:2.1e6,Makemake:2.1e6,Eris:5.9e6,Bulan:6.6e4},
ACH={all:["Have you explored everything? Cool.","Selesaikan semua misi"],planets:["All the planets are complete.","Jelajahi semua planet"],moons:["So, are there only 12 months?","Jelajahi semua bulan"],far:["Go home, dude... You’re very far away.","Capai objek terjauh (Eris)"],tawaf:["MashaAllah, you are performing Tawaf.","Kelilingi Bumi 7 kali"]};
const ap={on:false,dir:0,home:null,free:false};let IN=[0,0,0];
function setLv(x){lv=Math.max(-4,Math.min(Math.log10(C),x));$('sp').value=lv}
function award(k){if(ach.has(k))return;ach.add(k);save();setTimeout(()=>{toast("🏆 "+ACH[k][0]);snd('a')},1800);if(k==='all')setTimeout(()=>{document.body.classList.add('m');menuOn=true;mm();sub('end')},6500)}
function checkAch(){const all=n=>bodies.filter(b=>b.type===n).every(b=>found.has(b.n));
 if(all('planet'))award('planets');if(all('moon'))award('moons');
 const far=bodies.filter(b=>b!==sun&&b.type!=='moon').reduce((m,b)=>b.a>m.a?b:m);if(found.has(far.n))award('far');
 if(found.size==bodies.length-1)award('all')}
function tawaf(){const e=by.Bumi,dx=R.x-e.x,dy=R.y-e.y;if(Math.hypot(dx,dy)>SOI.Bumi){tw.a=null;tw.s=0;return}
 const a=Math.atan2(dy,dx);if(tw.a!==null){let d=a-tw.a;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;tw.s+=d}tw.a=a;if(Math.abs(tw.s)>=7*TAU)award('tawaf')}
function where(){let o=null;for(const b of bodies){const s=SOI[b.n];if(!s)continue;const d=Math.hypot(R.x-b.x,R.y-b.y);if(d<s&&(!o||s<o.s))o={b,d,s}}
 if(o)return "Orbit "+o.b.n+" · ketinggian "+fk(Math.max(0,o.d-o.b.r));
 const d=Math.hypot(R.x,R.y);
 if(d>1.012e10)return "🚪 Di luar tata surya (lewat orbit Eris)";
 if(d>3.29e8&&d<4.79e8)return "☄ Sabuk Asteroid";
 if(d>4.49e9&&d<7.5e9)return "❄ Sabuk Kuiper";
 const pl=bodies.filter(b=>b.type==='planet'),i=pl.findIndex(b=>b.a>d);
 if(i<0)return "Antara orbit Neptunus dan Eris";
 return i==0?"Di dalam orbit Merkurius":"Antara orbit "+pl[i-1].n+" dan "+pl[i].n}
// GAME
function game(dt,dS){
 let ix=joy.x+((K.d||K.arrowright)?1:0)-((K.a||K.arrowleft)?1:0),iy=joy.y+((K.s||K.arrowdown)?1:0)-((K.w||K.arrowup)?1:0);
 let m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m;m=1}if(menuOn&&!playing){const E=by.Bumi,ex=R.x-E.x,ey=R.y-E.y,dd=Math.hypot(ex,ey)||1,c=(dd-E.r*1.6)/E.r;ix=-ey/dd-ex/dd*c;iy=ex/dd-ey/dd*c;const q=Math.hypot(ix,iy)||1;ix/=q;iy/=q;m=1}IN=[ix,iy,m];
 const v=menuOn&&!playing?1:10**lv,k=Math.min(1,dt*4);let sv=v;
 if(ap.on){if(m<.1)ap.free=true;else if(ap.free){ap.on=false;hl()}}
 if(ap.on){if(ap.home){const h=ap.home,hx=h.x-R.x,hy=h.y-R.y,d=Math.hypot(hx,hy),rem=d-h.r;
  if(rem<Math.max(h.r*.02,.02)){ap.on=false;hl();toast("🧭 Autopilot: tiba di "+h.n)}else{ix=hx/d;iy=hy/d;m=1;sv=Math.min(v,rem/(.7*dS/Math.max(dt,1e-6)))}}
  else{ix=Math.cos(ap.dir);iy=Math.sin(ap.dir);m=1}}
 R.vx+=(ix*sv-R.vx)*k;R.vy+=(iy*sv-R.vy)*k;R.thr=m;MV=[R.vx*dS,R.vy*dS];
 if(Math.hypot(R.vx,R.vy)>v*.02)R.h=Math.atan2(R.vy,R.vx);
 const x0=R.x,y0=R.y;R.x+=R.vx*dS;R.y+=R.vy*dS;const dx=R.x-x0,dy=R.y-y0,l=dx*dx+dy*dy;
 for(const b of bodies){const u=l?Math.max(0,Math.min(1,((b.x-x0)*dx+(b.y-y0)*dy)/l)):0,px=x0+dx*u,py=y0+dy*u,d=Math.hypot(px-b.x,py-b.y);
  if(b!==sun&&d<Math.max(3*b.r,1500)&&!found.has(b.n)){found.add(b.n);if(target===b)target=null;toast("🔭 Ditemukan: "+b.n+" ("+found.size+"/"+(bodies.length-1)+")");checkAch();save();snd('f')}
  if(d<b.r){if(b===sun){toast("🔥 Roket terbakar di Matahari! Kembali ke Bumi.");resetR();return}
   const nx=d?(px-b.x)/d:1,ny=d?(py-b.y)/d:0;R.x=b.x+nx*b.r*1.001;R.y=b.y+ny*b.r*1.001;R.vx=R.vy=0;if(ap.on){ap.on=false;hl();toast("🧭 Autopilot berhenti: tiba di "+b.n)}break}}
 let best=null,bs=6;for(const b of bodies){const q=Math.hypot(R.x-b.x,R.y-b.y)/b.r;if(q<bs){bs=q;best=b}}R.anc=best;tawaf();
 tgt=null;let nd=1e30;for(const b of bodies)if(b!==sun&&!found.has(b.n)){const d=Math.hypot(b.x-R.x,b.y-R.y);if(d<nd){nd=d;tgt=b}}
 if(target&&!found.has(target.n))tgt=target;
}
function camera(dt){
 if(mode==='g'){if(auto)LZT=clampZ(Math.log10(90/(10**lv*86400*Math.max(days,1e-9))));cam.x=R.x;cam.y=R.y}
 else if(follow){const f=Math.abs(LZ-LZT)>.02?1-Math.exp(-dt*7):1;cam.x+=(follow.x-cam.x)*f;cam.y+=(follow.y-cam.y)*f}
 LZ+=(LZT-LZ)*(1-Math.exp(-dt*6));if(Math.abs(LZT-LZ)<.001)LZ=LZT;$('zs').value=LZ}
// GAMBAR
function cpath(x,y,r,lw){const d=Math.hypot(W/2-x,H/2-y),dg=Math.hypot(W,H)/2+lw;if(Math.abs(d-r)>dg)return false;ctx.beginPath();
 if(r<4000){ctx.arc(x,y,r,0,TAU);return true}
 const a=Math.atan2(H/2-y,W/2-x),h=Math.min(Math.PI,(dg*1.4+40)/r),n=Math.ceil(2*h*r/20)+1;
 for(let i=0;i<=n;i++){const g=a-h+2*h*i/n;ctx[i?'lineTo':'moveTo'](x+r*Math.cos(g),y+r*Math.sin(g))}return true}
function disk(x,y,r,f){const d=Math.hypot(W/2-x,H/2-y),g=Math.hypot(W,H)/2;ctx.fillStyle=f;
 if(d+g<r){ctx.fillRect(0,0,W,H);return}if(d-g>r)return;if(cpath(x,y,r,0)){if(r>=4000)ctx.lineTo(x,y);ctx.fill()}}
function draw(){
